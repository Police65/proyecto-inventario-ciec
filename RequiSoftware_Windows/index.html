  <title>RequiSoftware CIEC - Gestión de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class', // or 'media'
      theme: {
        extend: {
          colors: {
            primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"},
            gray: {
              '50': '#f9fafb',
              '100': '#f3f4f6',
              '200': '#e5e7eb',
              '300': '#d1d5db',
              '400': '#9ca3af',
              '500': '#6b7280',
              '600': '#4b5563',
              '700': '#374151',
              '800': '#1f2937',
              '900': '#111827',
              '950': '#030712'
            }
          }
        }
      }
    }
  </script>
  <script>
    // Se añade este script en el <head> para evitar el FOUC (Flash Of Unstyled Content) del tema.
    // Da prioridad a la selección del usuario en localStorage, y si no existe,
    // usa la preferencia del sistema operativo.
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

<style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-content {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      80% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in-animation {
      animation: popIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* Shepherd.js Dark Theme Overrides */
    .dark .shepherd-element {
      background-color: #1f2937; /* gray-800 */
      border-radius: 0.75rem; /* rounded-lg */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid #374151; /* gray-700 */
    }
    .dark .shepherd-header {
      background-color: #374151; /* gray-700 */
      border-bottom: 1px solid #4b5563; /* gray-600 */
      padding: 0.75rem 1rem;
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
    }
    .dark .shepherd-title {
      color: #1f2937; /* gray-800 */
      font-weight: 600;
    }
    .dark .shepherd-text {
      color: #d1d5db; /* gray-300 */
      padding: 1rem;
    }
    .dark .shepherd-cancel-icon {
      color: #9ca3af; /* gray-400 */
    }
    .dark .shepherd-cancel-icon:hover {
      color: #f9fafb; /* gray-50 */
    }
    .dark .shepherd-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid #374151; /* gray-700 */
      background-color: transparent;
    }
    /* Button Styles */
    .dark .shepherd-button {
      transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
      border-radius: 0.375rem; /* rounded-md */
      padding: 0.5rem 1rem;
      font-weight: 500;
    }
    /* Primary Button (Next/Siguiente/Finalizar) */
    .dark .shepherd-button.shepherd-button-primary {
      background-color: #2563eb; /* primary-600 */
      color: #ffffff;
    }
    .dark .shepherd-button.shepherd-button-primary:hover {
      background-color: #1d4ed8; /* primary-700 */
    }
    /* Secondary Button (Back/Anterior) */
    .dark .shepherd-button.shepherd-button-secondary {
       background-color: #4b5563; /* gray-600 */
       color: #d1d5db; /* gray-300 */
    }
    .dark .shepherd-button.shepherd-button-secondary:hover {
       background-color: #374151; /* gray-700 */
    }
    /* Arrow color for dark mode */
    .dark .shepherd-element[data-popper-placement^="top"] > .shepherd-arrow::before {
        border-top-color: #1f2937; /* Match body bg */
    }
    .dark .shepherd-element[data-popper-placement^="bottom"] > .shepherd-arrow::before {
        border-bottom-color: #374151; /* Match header bg */
    }
    .dark .shepherd-element[data-popper-placement^="left"] > .shepherd-arrow::before {
        border-left-color: #1f2937; /* Match body bg */
    }
    .dark .shepherd-element[data-popper-placement^="right"] > .shepherd-arrow::before {
        border-right-color: #1f2937; /* Match body bg */
    }
</style>
